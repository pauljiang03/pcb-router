defaults:
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 5e5
  parallel: False
  eval_every: 1e4
  eval_episode_num: 10
  log_every: 5e3
  reset_every: 0
  device: 'cuda:0'
  compile: False
  precision: 32
  debug: False
  video_pred_log: True
  task: 'pcb_tp_placement'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 25
  grayscale: False
  prefill: 5000
  reward_EMA: True
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'onehot', std: 'none', entropy: 3e-3, unimix_ratio: 0.01, min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  # Faithful action masking (P0.3): the world model learns a per-candidate
  # valid-action head trained on obs["mask"]; imagination suppresses invalid
  # logits with the PREDICTED mask, the real-env policy with the ground truth.
  use_action_mask: True
  mask_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  # Cold start: smart_placement demo episodes cached in <logdir>/demo_eps,
  # sampled into batches at a fixed fraction (so they never dilute away), and
  # imitated by a behavior-cloning term on the actor that decays linearly from
  # bc_scale to 0 over bc_decay env steps. demo_episodes: 0 disables all of it.
  demo_episodes: 200
  demo_fraction: 0.25
  bc_scale: 1.0
  bc_decay: 2e5
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'
  batch_size: 16
  batch_length: 32
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 25
  imag_gradient: 'reinforce'
  imag_gradient_mix: 0.0
  eval_state_mean: False
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

# Sized for a single free-Colab T4 session (~2-4 h at 8 traces): checkpoints
# every 2.5k steps survive disconnects; BC fully decays mid-run so the second
# half is pure RL refinement. Use: python train.py --configs defaults colab
colab:
  steps: 3e4
  eval_every: 2.5e3
  log_every: 1e3
  prefill: 2500
  demo_episodes: 150
  bc_decay: 1.5e4

# Sized for a Colab Pro A100 at 20 traces (~3-6 h for 100k steps; checkpoints
# every 5k). Use: python train.py --configs defaults colab_a100 --num_traces 20
colab_a100:
  steps: 1e5
  eval_every: 5e3
  log_every: 1e3
  demo_episodes: 200
  bc_decay: 4e4

debug:
  debug: True
  pretrain: 10
  prefill: 200
  batch_size: 10
  batch_length: 16
  steps: 1000
  eval_every: 500
  eval_episode_num: 2
  log_every: 100
  video_pred_log: False
  demo_episodes: 5
  bc_decay: 500